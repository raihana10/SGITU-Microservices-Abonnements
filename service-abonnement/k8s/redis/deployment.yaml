# Deploys an ephemeral Redis instance for local token/cache support.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sgitu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379

