# Deploys the utilisateur Spring Boot microservice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-utilisateur
  namespace: sgitu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-utilisateur
  template:
    metadata:
      labels:
        app: service-utilisateur
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db-utilisateur 5432; do sleep 3; done"]
      containers:
        - name: service-utilisateur
          image: g3-user-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-8083
              containerPort: 8083
          envFrom:
            - configMapRef: {name: sgitu-config}
            - secretRef: {name: sgitu-secrets}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SERVER_PORT
              value: "8083"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: {name: sgitu-config, key: UTILISATEUR_DB_NAME}
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db-utilisateur.sgitu.svc.cluster.local:5432/$(DB_NAME)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: {name: sgitu-secrets, key: UTILISATEUR_DB_USER}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: sgitu-secrets, key: UTILISATEUR_DB_PASSWORD}
            - name: G8_BASE_URL
              valueFrom:
                configMapKeyRef: {name: sgitu-config, key: ANALYTIQUE_SERVICE_URL}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http-8083}
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http-8083}
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
