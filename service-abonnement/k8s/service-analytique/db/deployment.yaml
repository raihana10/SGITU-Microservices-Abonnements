# Deploys the analytique MongoDB database for local Minikube.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: sgitu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef: {name: sgitu-config, key: MONGO_DATABASE}
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: analytique-mongodb-pvc
