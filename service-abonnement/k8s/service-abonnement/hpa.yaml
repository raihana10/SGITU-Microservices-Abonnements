# Provides a small CPU-based autoscaler example for service-abonnement.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service-abonnement
  namespace: sgitu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-abonnement
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

